
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#315c46">
<title>Renungan Harian 366</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f3ec;color:#29372e}
header{background:#315c46;color:white;text-align:center;padding:28px 16px}
main{max-width:680px;margin:20px auto;padding:0 14px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:14px}
h3{color:#315c46}p{line-height:1.7;white-space:pre-line}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#315c46;color:white;font-size:16px}
#status{text-align:center;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🌿 Renungan Harian</h1>
<p>Firman Tuhan untuk setiap langkahmu</p>
</header>
<main>
<div class="card">
<p id="tanggal">Renungan hari ini</p>
<h2 id="tema">Renungan Harian</h2>
<p id="ayat"></p><p id="referensi"></p>
</div>
<div class="card"><h3>Renungan</h3><p id="renungan"></p></div>
<div class="card"><h3>Refleksi</h3><p id="refleksi"></p></div>
<div class="card"><h3>Doa</h3><p id="doa"></p></div>
<button onclick="muatRenungan()">Muat Ulang Renungan</button>
<p id="status">Memuat...</p>
</main>
<script>
const API_URL = 'GANTI_DENGAN_URL_WEB_APP_KAMU';

async function muatRenungan(){
  const status=document.getElementById('status');
  status.textContent='Memuat renungan...';
  try{
    const response=await fetch(API_URL+'?data=renungan');
    if(!response.ok) throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(!data){
      status.textContent='Renungan hari ini belum tersedia atau belum berstatus Terbit.';
      return;
    }
    for(const key of ['tanggal','tema','ayat','referensi','renungan','refleksi','doa']){
      document.getElementById(key).textContent=data[key]||'';
    }
    status.textContent='';
  }catch(error){
    status.textContent='Data belum terhubung. Perlu mengaktifkan endpoint Apps Script.';
  }
}
muatRenungan();
</script>
</body>
</html>
