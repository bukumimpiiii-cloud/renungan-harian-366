
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#315c46">
<link rel="manifest" href="./manifest.json">  
<title>Renungan Harian 366</title>
<style>

:root {
  --hijau: #176b82;
  --hijau-muda: #258da3;
  --krem: #e8f7fa;
  --putih: #f5fcfd;
  --emas: #c5a568;
  --teks: #303b32;
  --teks-lembut: #73786f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  background: var(--krem);
  color: var(--teks);
  font-size: 16px;
}

header {
  background: var(--hijau);
  color: var(--putih);
  text-align: center;
  padding: 38px 20px 34px;
  border-bottom: 4px solid var(--emas);
}

header h1 {
  margin: 0 0 10px;
  font-size: 30px;
  font-weight: normal;
  letter-spacing: 1px;
}

header p {
  margin: 0;
  color: #e5dfd1;
  font-size: 14px;
  letter-spacing: 1px;
}

main {
  max-width: 680px;
  margin: 26px auto;
  padding: 0 16px 32px;
}


.card {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 24px 8px;
  margin-bottom: 0;
  box-shadow: none;
  border-bottom: 1px solid #8ecbd8;
}


h2, h3 {
  color: var(--hijau);
  font-weight: normal;
}

h3 {
  font-size: 20px;
  margin-top: 0;
  margin-bottom: 14px;
}

p {
  line-height: 1.9;
  white-space: pre-line;
}

#ayat {
  color: var(--hijau);
  font-size: 20px;
  line-height: 1.9;
  font-style: italic;
}

#referensi {
  color: #98763d;
  font-size: 14px;
  text-align: right;
}

button {
  width: 100%;
  padding: 15px;
  border: 1px solid var(--emas);
  border-radius: 5px;
  background: var(--hijau);
  color: white;
  font-family: Arial, sans-serif;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  background: var(--hijau-muda);
}

#status {
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: var(--teks-lembut);
  padding: 10px;
}

@media (max-width: 480px) {
  header {
    padding: 32px 16px 28px;
  }

  header h1 {
    font-size: 26px;
  }

  main {
    margin-top: 18px;
    padding-left: 12px;
    padding-right: 12px;
  }

  .card {
    padding: 21px 18px;
  }

  #ayat {
    font-size: 19px;
  }
}

</style>
</head>
<body>
<header>
<h1>🌿 Renungan Harian</h1>
<p>Firman Tuhan untuk setiap langkahmu</p>
</header>
<main>
<div class="card">
<p id="tanggal">Renungan hari ini</p>
<h2 id="tema">Renungan Harian</h2>
<p id="ayat"></p><p id="referensi"></p>
</div>
<div class="card"><h3>Renungan</h3><p id="renungan"></p></div>
<div class="card"><h3>Refleksi</h3><p id="refleksi"></p></div>
<div class="card"><h3>Doa</h3><p id="doa"></p></div>
<button onclick="muatRenungan()">Muat Ulang Renungan</button>
<p id="status">Memuat...</p>
</main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzLuJe9n2i9WOdUm9tbNKmu5wXklvXtHtI2jDUyXUmSwryU_b-siA24RHjGpc1niuOU/exec';

function muatRenungan() {
  const status = document.getElementById('status');
  status.textContent = 'Memuat renungan...';

  const callbackName = 'terimaRenungan' + Date.now();

  window[callbackName] = function(data) {
    delete window[callbackName];

    if (script.parentNode) script.parentNode.removeChild(script);

    if (!data) {
      status.textContent =
        'Renungan hari ini belum tersedia atau belum berstatus Terbit.';
      return;
    }

    ['tanggal', 'tema', 'ayat', 'referensi',
     'renungan', 'refleksi', 'doa'].forEach(function(key) {
      document.getElementById(key).textContent = data[key] || '';
    });

    status.textContent = '';
  };

  const script = document.createElement('script'); 
script.src = API_URL + '?data=renungan&callback=' + callbackName;


  script.onerror = function() {
    delete window[callbackName];
    status.textContent =
      'Koneksi gagal. Periksa URL Web App dan deployment Apps Script.';
    if (script.parentNode) script.parentNode.removeChild(script);
  };

  document.body.appendChild(script);
}
  
muatRenungan();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .catch(function(error) {
        console.error('Service worker gagal:', error);
      });
  });
}
</script>
</body>
</html>
